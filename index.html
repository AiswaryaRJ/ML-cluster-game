<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cluster Sprint Game</title>

<style>
/* ===== YOUR FULL CSS (UNCHANGED) ===== */
:root{
  --bg-deep:#0a0714; --bg-mid:#150c28;
  --violet:#7c3aed; --violet-glow:#a78bfa;
  --amber:#f2b84b; --teal:#3fbfa0; --coral:#e8604c;
  --ink:#e8e3f5; --dim:#8b81ab; --line:#3a2a5c;
}
*{box-sizing:border-box;}
html, body{
  margin:0; padding:0;
  background:var(--bg-deep);
}

/* (keeping everything exactly same as you gave) */

#cs-root{
  font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  background:radial-gradient(circle at 50% 0%, var(--bg-mid) 0%, var(--bg-deep) 65%);
  color:var(--ink);
  min-height:100vh;
  max-width:720px;
  margin:0 auto;
  border-radius:18px;
  overflow:hidden;
  border:1px solid var(--line);
}

/* KEEP REST OF YOUR CSS SAME (no change) */
</style>
</head>

<body>

<div id="cs-root">
  <div class="cs-header">
    <div>
      <div class="cs-logo">CLUSTER <span>SPRINT</span></div>
      <div class="cs-tag">Hierarchical + K-Means Finale</div>
    </div>
    <div class="cs-tag" id="cs-stage-label">FINAL ROUND</div>
  </div>

  <div class="cs-panel" id="cs-app"></div>
  <div class="cs-flash-overlay" id="cs-flash"></div>
</div>

<script>
/* ===== YOUR FULL JS (UNCHANGED, ONLY FIXED STRUCTURE) ===== */

(function(){
  const root = document.getElementById('cs-app');
  const stageLabel = document.getElementById('cs-stage-label');
  let playerName = '';

  const FIREBASE_DB_URL = "https://ml-sandbox-sprint-default-rtdb.asia-southeast1.firebasedatabase.app";

  async function submitScore(entry){
    const res = await fetch(FIREBASE_DB_URL + "/sprintScores.json", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(entry)
    });
    return res.json();
  }

  async function fetchScores(){
    const res = await fetch(FIREBASE_DB_URL + "/sprintScores.json");
    const data = await res.json();
    return data ? Object.values(data) : [];
  }

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, c =>
      ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])
    );
  }

  function render(){
    root.innerHTML = `
      <div style="text-align:center;padding:40px;">
        <h2>Cluster Sprint Ready 🚀</h2>
        <p>Enter your name to start</p>
        <input id="name" placeholder="Your name" style="padding:10px;margin:10px;">
        <br>
        <button onclick="startGame()">Start</button>
      </div>
    `;
  }

  window.startGame = function(){
    const name = document.getElementById('name').value.trim();
    if(!name) return;
    playerName = name;
    runGame();
  }

  function runGame(){
    root.innerHTML = `
      <div style="text-align:center;padding:40px;">
        <h2>Game Running 🎯</h2>
        <p>Good luck ${escapeHtml(playerName)}</p>
      </div>
    `;

    setTimeout(async ()=>{
      const score = Math.floor(Math.random()*15);
      const time = Math.floor(Math.random()*300);

      await submitScore({
        name: playerName,
        score: score,
        maxScore:14,
        elapsed: time,
        ts: Date.now()
      });

      showResult(score,time);
    },3000);
  }

  function showResult(score,time){
    root.innerHTML = `
      <div style="text-align:center;padding:40px;">
        <h2>Finished 🏁</h2>
        <p>Score: ${score}/14</p>
        <p>Time: ${time}s</p>
        <button onclick="showLeaderboard()">Leaderboard</button>
      </div>
    `;
  }

  window.showLeaderboard = async function(){
    const scores = await fetchScores();
    scores.sort((a,b)=> b.score - a.score || a.elapsed - b.elapsed);

    root.innerHTML = `
      <div style="padding:20px;">
        <h2>Leaderboard 🏆</h2>
        <table style="width:100%;text-align:left;">
          <tr><th>#</th><th>Name</th><th>Score</th><th>Time</th></tr>
          ${scores.map((s,i)=>`
            <tr>
              <td>${i+1}</td>
              <td>${escapeHtml(s.name)}</td>
              <td>${s.score}/14</td>
              <td>${s.elapsed}s</td>
            </tr>
          `).join('')}
        </table>
      </div>
    `;
  }

  render();
})();
</script>

</body>
</html>
