<script>
(function(){
  const root = document.getElementById('mlsb-app');
  const stageLabel = document.getElementById('mlsb-stage-label');
  let playerName = '';
  let isHost = false;

  const FIREBASE_DB_URL = "PASTE_YOUR_FIREBASE_DATABASE_URL_HERE";

  async function submitScore(entry){
    const res = await fetch(FIREBASE_DB_URL + "/scores.json", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify(entry)
    });
    if (!res.ok) throw new Error("Firebase write failed");
    return res.json();
  }

  async function fetchScores(){
    const res = await fetch(FIREBASE_DB_URL + "/scores.json");
    if (!res.ok) throw new Error("Firebase read failed");
    const data = await res.json();
    if (!data) return [];
    return Object.values(data);
  }

  const POINTS = [
    {id:0, x:80,  y:260, label:'A'},
    {id:1, x:130, y:230, label:'B'},
    {id:2, x:340, y:90,  label:'C'},
    {id:3, x:390, y:120, label:'D'},
    {id:4, x:230, y:300, label:'E'},
    {id:5, x:410, y:280, label:'F'},
    {id:6, x:150, y:120, label:'G'},
    {id:7, x:300, y:250, label:'H'},
    {id:8, x:420, y:190, label:'I'},
    {id:9, x:60,  y:100, label:'J'},
  ];

  function dist(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }

  function render(){
    root.innerHTML = '';
    if (window.location.hash === '#host') { isHost = true; renderHostView(); return; }
    if (!playerName) { renderNameEntry(); return; }
    renderGame();
  }

  function renderNameEntry(){
    root.innerHTML = `
      <div style="max-width:420px;margin:20px auto;text-align:center;">
        <div class="mlsb-glow-title">SPEED CLUSTER</div>
        <input class="mlsb-input" id="mlsb-name-input" placeholder="Enter your name">
        <button class="mlsb-diamond-btn" id="mlsb-start-btn">START</button>
      </div>
    `;
    document.getElementById('mlsb-start-btn').onclick = () => {
      const v = document.getElementById('mlsb-name-input').value.trim();
      if (!v) return;
      playerName = v;
      render();
    };
  }

  let clusters, correctScore, timeLeft, timerHandle, gameActive, selected;

  function resetGame(){
    clusters = POINTS.map(p => ({ ids:[p.id], points:[p] }));
    correctScore = 0;
    selected = [];
    gameActive = false;
    timeLeft = 120;
  }

  function minLinkageDistance(c1,c2){
    let bestPair = null;
    let min = Infinity;

    for(const a of c1.points){
      for(const b of c2.points){
        const d = dist(a,b);
        if (d < min){
          min = d;
          bestPair = [a,b,d];
        }
      }
    }
    return bestPair;
  }

  function nearestNeighborOf(ci){
    let best=-1, bestD=Infinity;
    for(let k=0;k<clusters.length;k++){
      if (k===ci) continue;
      const [, , d] = minLinkageDistance(clusters[ci],clusters[k]);
      if (d<bestD){ bestD=d; best=k; }
    }
    return best;
  }

  function isValidMerge(i,j){
    return nearestNeighborOf(i)===j && nearestNeighborOf(j)===i;
  }

  function renderGame(){
    resetGame();
    root.innerHTML = `
      <div id="mlsb-canvas-wrap">
        <canvas id="mlsb-canvas" width="480" height="340"></canvas>
      </div>
      <div id="mlsb-formula" style="margin-top:15px;font-family:monospace;color:#f2b84b;"></div>
      <button id="mlsb-go-btn">START</button>
    `;

    const canvas = document.getElementById('mlsb-canvas');
    const ctx = canvas.getContext('2d');

    function draw(){
      ctx.clearRect(0,0,canvas.width,canvas.height);
      clusters.forEach(c=>{
        c.points.forEach(p=>{
          ctx.beginPath();
          ctx.arc(p.x,p.y,8,0,Math.PI*2);
          ctx.fillStyle="#a78bfa";
          ctx.fill();
          ctx.fillText(p.label, p.x+10, p.y-10);
        });
      });
    }

    function clusterAt(x,y){
      for(let ci=0; ci<clusters.length; ci++){
        for(const p of clusters[ci].points){
          if (Math.hypot(p.x-x,p.y-y) < 14) return ci;
        }
      }
      return -1;
    }

    canvas.addEventListener('click', (e)=>{
      if (!gameActive) return;
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX-rect.left, y=e.clientY-rect.top;
      const ci = clusterAt(x,y);
      if (ci===-1) return;

      selected.push(ci);
      if (selected.length===2){
        attemptMerge(selected[0], selected[1]);
        selected=[];
      }
    });

    function showFormula(p1,p2,d){
      const formulaDiv = document.getElementById('mlsb-formula');
      formulaDiv.innerHTML += `
        <div>
        d(${p1.label},${p2.label}) = √[( ${p1.x} - ${p2.x} )² + ( ${p1.y} - ${p2.y} )²]
        = √[( ${p1.x-p2.x} )² + ( ${p1.y-p2.y} )²]
        = ${d.toFixed(2)}
        </div><br>
      `;
    }

    function attemptMerge(i,j){
      if (isValidMerge(i,j)){
        const [p1,p2,d] = minLinkageDistance(clusters[i],clusters[j]);

        showFormula(p1,p2,d); // ⭐ YOUR FEATURE

        clusters[i] = {
          ids:[...clusters[i].ids,...clusters[j].ids],
          points:[...clusters[i].points,...clusters[j].points]
        };
        clusters.splice(j,1);
        correctScore++;
      }
      draw();
    }

    draw();

    document.getElementById('mlsb-go-btn').onclick = ()=>{
      gameActive=true;
    };
  }

  function renderHostView(){}

  render();
})();
</script>
