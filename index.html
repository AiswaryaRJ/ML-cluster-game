<style>

  :root{

    --bg-deep:#0a0714;

    --bg-mid:#150c28;

    --violet:#7c3aed;

    --violet-glow:#a78bfa;

    --amber:#f2b84b;

    --teal:#3fbfa0;

    --coral:#e8604c;

    --ink:#e8e3f5;

    --dim:#8b81ab;

    --line:#3a2a5c;

  }

  *{box-sizing:border-box;}

  #mlsb-root{

    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;

    background:radial-gradient(circle at 50% 0%, var(--bg-mid) 0%, var(--bg-deep) 65%);

    color:var(--ink);

    min-height:600px;

    border-radius:18px;

    padding:0;

    position:relative;

    overflow:hidden;

    border:1px solid var(--line);

  }

  #mlsb-root::before{

    content:'';

    position:absolute;top:0;left:0;right:0;height:100%;

    background-image:

      linear-gradient(var(--line) 1px, transparent 1px),

      linear-gradient(90deg, var(--line) 1px, transparent 1px);

    background-size:40px 40px;

    opacity:0.12;

    pointer-events:none;

  }

  .mlsb-header{

    display:flex;align-items:center;justify-content:space-between;

    padding:16px 24px;border-bottom:1px solid var(--line);

    position:relative;z-index:2;

  }

  .mlsb-logo{

    font-weight:800;letter-spacing:2px;font-size:15px;color:var(--ink);

    text-transform:uppercase;

  }

  .mlsb-logo span{color:var(--violet-glow);}

  .mlsb-tag{font-size:11px;color:var(--dim);letter-spacing:3px;text-transform:uppercase;}

  .mlsb-panel{

    position:relative;z-index:2;padding:28px 24px;

  }

  .mlsb-diamond-btn{

    display:inline-block;

    background:linear-gradient(135deg,var(--violet) 0%,#4c1d95 100%);

    color:#fff;border:1px solid var(--violet-glow);

    padding:12px 28px;font-weight:700;letter-spacing:1.5px;

    text-transform:uppercase;font-size:13px;cursor:pointer;

    clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);

    transition:all .15s ease;box-shadow:0 0 18px rgba(124,58,237,.45);

  }

  .mlsb-diamond-btn:hover{box-shadow:0 0 28px rgba(167,139,250,.75);transform:translateY(-1px);}

  .mlsb-diamond-btn:disabled{opacity:.35;cursor:not-allowed;box-shadow:none;}

  .mlsb-input{

    background:rgba(255,255,255,.04);border:1px solid var(--line);

    color:var(--ink);padding:11px 14px;font-size:14px;border-radius:6px;

    outline:none;width:100%;

  }

  .mlsb-input:focus{border-color:var(--violet-glow);}

  .mlsb-card{

    background:rgba(255,255,255,.03);border:1px solid var(--line);

    border-radius:10px;padding:18px;position:relative;

  }

  .mlsb-glow-title{

    font-size:26px;font-weight:800;letter-spacing:1px;

    background:linear-gradient(90deg,#fff,var(--violet-glow));

    -webkit-background-clip:text;background-clip:text;color:transparent;

  }

  .mlsb-sub{color:var(--dim);font-size:13px;line-height:1.6;}

  .mlsb-hud{

    display:flex;gap:16px;margin-bottom:16px;flex-wrap:wrap;

  }

  .mlsb-hud-box{

    background:rgba(124,58,237,.1);border:1px solid var(--violet);

    border-radius:8px;padding:10px 16px;text-align:center;min-width:100px;

  }

  .mlsb-hud-box .num{font-size:22px;font-weight:800;color:var(--amber);font-family:monospace;}

  .mlsb-hud-box .lbl{font-size:10px;letter-spacing:1.5px;color:var(--dim);text-transform:uppercase;margin-top:2px;}

  #mlsb-canvas-wrap{position:relative;}

  #mlsb-canvas{

    background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:10px;

    width:100%;display:block;cursor:pointer;

  }

  #mlsb-feedback{

    position:absolute;top:10px;right:10px;padding:6px 16px;border-radius:6px;

    font-weight:700;font-size:13px;letter-spacing:1px;opacity:0;transition:opacity .2s;

    pointer-events:none;

  }

  #mlsb-feedback.correct{background:rgba(63,191,160,.2);color:var(--teal);border:1px solid var(--teal);opacity:1;}

  #mlsb-feedback.wrong{background:rgba(232,96,76,.2);color:var(--coral);border:1px solid var(--coral);opacity:1;}

  .shake{animation:mlsb-shake .35s;}

  @keyframes mlsb-shake{

    0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}

  }

  .pulse{animation:mlsb-pulse .5s;}

  @keyframes mlsb-pulse{

    0%{filter:drop-shadow(0 0 0px var(--teal));}

    50%{filter:drop-shadow(0 0 14px var(--teal));}

    100%{filter:drop-shadow(0 0 0px var(--teal));}

  }

  table.mlsb-lb{width:100%;border-collapse:collapse;font-size:14px;}

  table.mlsb-lb th{text-align:left;color:var(--dim);font-size:11px;letter-spacing:1px;text-transform:uppercase;padding:8px 10px;border-bottom:1px solid var(--line);}

  table.mlsb-lb td{padding:10px 10px;border-bottom:1px solid rgba(58,42,92,.4);}

  table.mlsb-lb tr:first-child td{color:var(--amber);font-weight:800;}

  .rank-badge{

    display:inline-block;width:22px;height:22px;border-radius:50%;

    background:rgba(124,58,237,.25);text-align:center;line-height:22px;

    font-size:11px;font-weight:700;color:var(--violet-glow);

  }

  .mlsb-mode-toggle{

    position:absolute;top:16px;right:24px;font-size:11px;color:var(--dim);

    cursor:pointer;text-decoration:underline;z-index:3;

  }

  .mlsb-flex-between{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}

  

  

</style>

<div id="mlsb-root">

  <div class="mlsb-header">

    <div>

      <div class="mlsb-logo">M<span>L</span> SANDBOX</div>

      <div class="mlsb-tag">Train · Predict · Conquer</div>

    </div>

    <div class="mlsb-tag" id="mlsb-stage-label">SPEED CLUSTER</div>

  </div>

  <div class="mlsb-panel" id="mlsb-app"></div>

</div>

<script>
(function(){
  const root = document.getElementById('mlsb-app');
  const stageLabel = document.getElementById('mlsb-stage-label');
  let playerName = '';
  let isHost = false;

  const FIREBASE_DB_URL = "PASTE_YOUR_FIREBASE_DATABASE_URL_HERE";

  async function submitScore(entry){
    const res = await fetch(FIREBASE_DB_URL + "/scores.json", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify(entry)
    });
    if (!res.ok) throw new Error("Firebase write failed");
    return res.json();
  }

  async function fetchScores(){
    const res = await fetch(FIREBASE_DB_URL + "/scores.json");
    if (!res.ok) throw new Error("Firebase read failed");
    const data = await res.json();
    if (!data) return [];
    return Object.values(data);
  }

  const POINTS = [
    {id:0, x:80,  y:260, label:'A'},
    {id:1, x:130, y:230, label:'B'},
    {id:2, x:340, y:90,  label:'C'},
    {id:3, x:390, y:120, label:'D'},
    {id:4, x:230, y:300, label:'E'},
    {id:5, x:410, y:280, label:'F'},
    {id:6, x:150, y:120, label:'G'},
    {id:7, x:300, y:250, label:'H'},
    {id:8, x:420, y:190, label:'I'},
    {id:9, x:60,  y:100, label:'J'},
  ];

  function dist(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }

  function render(){
    root.innerHTML = '';
    if (window.location.hash === '#host') { isHost = true; renderHostView(); return; }
    if (!playerName) { renderNameEntry(); return; }
    renderGame();
  }

  function renderNameEntry(){
    root.innerHTML = `
      <div style="max-width:420px;margin:20px auto;text-align:center;">
        <div class="mlsb-glow-title">SPEED CLUSTER</div>
        <input class="mlsb-input" id="mlsb-name-input" placeholder="Enter your name">
        <button class="mlsb-diamond-btn" id="mlsb-start-btn">START</button>
      </div>
    `;
    document.getElementById('mlsb-start-btn').onclick = () => {
      const v = document.getElementById('mlsb-name-input').value.trim();
      if (!v) return;
      playerName = v;
      render();
    };
  }

  let clusters, correctScore, timeLeft, timerHandle, gameActive, selected;

  function resetGame(){
    clusters = POINTS.map(p => ({ ids:[p.id], points:[p] }));
    correctScore = 0;
    selected = [];
    gameActive = false;
    timeLeft = 120;
  }

  function minLinkageDistance(c1,c2){
    let bestPair = null;
    let min = Infinity;

    for(const a of c1.points){
      for(const b of c2.points){
        const d = dist(a,b);
        if (d < min){
          min = d;
          bestPair = [a,b,d];
        }
      }
    }
    return bestPair;
  }

  function nearestNeighborOf(ci){
    let best=-1, bestD=Infinity;
    for(let k=0;k<clusters.length;k++){
      if (k===ci) continue;
      const [, , d] = minLinkageDistance(clusters[ci],clusters[k]);
      if (d<bestD){ bestD=d; best=k; }
    }
    return best;
  }

  function isValidMerge(i,j){
    return nearestNeighborOf(i)===j && nearestNeighborOf(j)===i;
  }

  function renderGame(){
    resetGame();
    root.innerHTML = `
      <div id="mlsb-canvas-wrap">
        <canvas id="mlsb-canvas" width="480" height="340"></canvas>
      </div>
      <div id="mlsb-formula" style="margin-top:15px;font-family:monospace;color:#f2b84b;"></div>
      <button id="mlsb-go-btn">START</button>
    `;

    const canvas = document.getElementById('mlsb-canvas');
    const ctx = canvas.getContext('2d');

    function draw(){
      ctx.clearRect(0,0,canvas.width,canvas.height);
      clusters.forEach(c=>{
        c.points.forEach(p=>{
          ctx.beginPath();
          ctx.arc(p.x,p.y,8,0,Math.PI*2);
          ctx.fillStyle="#a78bfa";
          ctx.fill();
          ctx.fillText(p.label, p.x+10, p.y-10);
        });
      });
    }

    function clusterAt(x,y){
      for(let ci=0; ci<clusters.length; ci++){
        for(const p of clusters[ci].points){
          if (Math.hypot(p.x-x,p.y-y) < 14) return ci;
        }
      }
      return -1;
    }

    canvas.addEventListener('click', (e)=>{
      if (!gameActive) return;
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX-rect.left, y=e.clientY-rect.top;
      const ci = clusterAt(x,y);
      if (ci===-1) return;

      selected.push(ci);
      if (selected.length===2){
        attemptMerge(selected[0], selected[1]);
        selected=[];
      }
    });

    function showFormula(p1,p2,d){
      const formulaDiv = document.getElementById('mlsb-formula');
      formulaDiv.innerHTML += `
        <div>
        d(${p1.label},${p2.label}) = √[( ${p1.x} - ${p2.x} )² + ( ${p1.y} - ${p2.y} )²]
        = √[( ${p1.x-p2.x} )² + ( ${p1.y-p2.y} )²]
        = ${d.toFixed(2)}
        </div><br>
      `;
    }

    function attemptMerge(i,j){
      if (isValidMerge(i,j)){
        const [p1,p2,d] = minLinkageDistance(clusters[i],clusters[j]);

        showFormula(p1,p2,d); // ⭐ YOUR FEATURE

        clusters[i] = {
          ids:[...clusters[i].ids,...clusters[j].ids],
          points:[...clusters[i].points,...clusters[j].points]
        };
        clusters.splice(j,1);
        correctScore++;
      }
      draw();
    }

    draw();

    document.getElementById('mlsb-go-btn').onclick = ()=>{
      gameActive=true;
    };
  }

  function renderHostView(){}

  render();
})();
</script>
